spring:
  application:
    name: zhongyi-web-management
  # AI辅助生成：Google Gemini (大语言模型), 2026-01-28
  # 本地开发默认连接 localhost；生产环境建议结合 Spring Profiles 覆盖为独立配置
  datasource:
    url: jdbc:mysql://localhost:3306/zhongyi?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 2018620530tX@
    # 可选：Hikari连接池优化配置（提升性能）
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  
  # Jackson JSON 反序列化配置
  jackson:
    # 允许空字符串转数字为null
    deserialization:
      ACCEPT_EMPTY_STRING_AS_NULL_OBJECT: true
    # 忽略序列化时的空值
    default-property-inclusion: non_null

# MyBatis 配置（注意层级：与spring平级，不是在spring内部）
mybatis:
  # 1. 指定 XML 映射文件位置
  mapper-locations: classpath:mapper/*.xml
  # 2. 实体类包名（简化XML中的类名引用）
  type-aliases-package: com.tx.demo.entity
  # 3. 核心配置
  configuration:
    # 开启控制台打印SQL（替代log-impl，更推荐用logging配置）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 开启驼峰命名自动映射（id_card -> idCard）
    map-underscore-to-camel-case: true
    # 可选：开启懒加载、关闭缓存等
    lazy-loading-enabled: false
    cache-enabled: false

# 日志配置（可选，增强SQL日志输出）
logging:
  level:
    # 打印你的Mapper接口所在包的SQL日志
    com.tx.demo.mapper: debug

# =============================================
